[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "programascontabilidad-studio"
version = "0.1.0"
description = "Safe initial scaffold for the PdC autonomous editorial agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Solo para recomprimir la portada bajo PDC_IMAGE_MAX_KB. Sin Pillow, la imagen se sube
# tal como llega del gateway y el paso lo anota.
image = ["pillow>=11"]
# El vigía de precios: lee páginas con bs4/lxml y, cuando la página es una SPA, con Chromium.
vigia = ["beautifulsoup4>=4", "lxml>=5", "playwright>=1.40"]

[project.scripts]
pdc-agent = "orchestrator.cli:main"

# Varias carpetas de primer nivel (datos, rules, skills) no son paquetes. Sin esta línea
# setuptools se niega a instalar: «Multiple top-level packages discovered in a flat-layout».
[tool.setuptools]
packages = ["orchestrator"]
